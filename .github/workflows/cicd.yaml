name: CI and Deployy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image for pull request
        if: github.event_name == 'pull_request'
        run: docker build -t cipp:${{ github.sha }} .

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cipp:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cipp:latest

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Add the EC2_HOST GitHub Actions secret}"
          : "${EC2_USER:?Add the EC2_USER GitHub Actions secret}"
          : "${EC2_SSH_KEY:?Add the EC2_SSH_KEY GitHub Actions secret}"
          : "${DOCKERHUB_USERNAME:?Add the DOCKERHUB_USERNAME GitHub Actions secret}"

          if [[ ! "$EC2_USER" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::EC2_USER must be only the SSH login name (for example, ec2-user), without a host, @, or whitespace."
            exit 1
          fi

          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::DOCKERHUB_USERNAME must be a lowercase Docker Hub username containing only letters, numbers, underscores, or hyphens."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | ssh-add -

          image_ref="${DOCKERHUB_USERNAME}/cipp:${GITHUB_SHA}"
          sh scripts/deploy-via-ssh.sh "$EC2_USER" "$EC2_HOST" "$image_ref"